<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 - Page Not Found · Jaynagar Milan Utsav 2026</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0f0d">
  <link rel="icon" href="assets/jmu-logo-small.webp">
  <link rel="stylesheet" href="styles-v2.css">
  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      position: relative;
      background: radial-gradient(circle at center, rgba(92, 27, 38, 0.4) 0%, rgba(10, 15, 13, 0.98) 75%);
    }
    .error-card {
      max-width: 540px;
      padding: 48px 36px;
      background: rgba(20, 29, 24, 0.85);
      border: 1px solid rgba(230, 188, 112, 0.35);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .error-code {
      font-family: var(--display);
      font-size: clamp(72px, 14vw, 120px);
      font-weight: 800;
      line-height: 1;
      color: var(--gold);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(230, 188, 112, 0.3);
    }
    .error-title {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--paper);
      margin-bottom: 14px;
    }
    .error-desc {
      font-size: 15.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold);
      color: var(--ink);
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .error-btn:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(230, 188, 112, 0.3);
    }
  </style>
</head>
<body>
  <div class="error-hero">
    <div class="error-card">
      <img src="assets/jmu-logo-small.webp" width="64" height="64" alt="Jaynagar Milan Utsav" style="border-radius:50%; border:1.5px solid var(--gold); margin-bottom:16px;">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        Looks like you stepped outside the Garba circle. This page doesn't exist, but the grand festival awaits you on our main stage!
      </p>
      <a href="/" class="error-btn">Return to Festival Homepage ➔</a>
    </div>
  </div>
</body>
</html>
